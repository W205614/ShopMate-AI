name: Application validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation links
        working-directory: .
        run: node scripts/check-docs.mjs
      - name: Check latest-backup retention safety
        working-directory: .
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Install PDF extraction tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
        working-directory: .
      # A cross-boundary regression imports the storefront review eligibility helper.
      # Install both workspaces before either suite resolves their tsconfig dependencies.
      - run: npm ci
      - run: npm run typecheck
        working-directory: backend
      - name: Check production deployment syntax
        working-directory: .
        run: |
          node --check scripts/production-preflight.mjs
          node --check scripts/production-edge-vex.mjs
          bash -n scripts/production-release.sh
          PRODUCTION_ENV_FILE="$GITHUB_WORKSPACE/.env.production.example" docker compose --env-file .env.production.example -f deploy/compose.production.yaml config --quiet
      - name: Start isolated SMTP and S3 protocol services
        working-directory: .
        run: |
          docker compose -p shopmate-external-ci -f deploy/compose.external-acceptance.yaml up -d
          node --input-type=module <<'JS'
          const endpoints = ['http://127.0.0.1:18126/readyz', 'http://127.0.0.1:18127/'];
          for (const endpoint of endpoints) {
            let ready = false;
            for (let attempt = 0; attempt < 45; attempt++) {
              try { const response = await fetch(endpoint, {signal: AbortSignal.timeout(2000)}); await response.body?.cancel(); if(response.ok) { ready=true; break; } } catch {}
              await new Promise(resolve=>setTimeout(resolve,1000));
            }
            if(!ready) throw new Error('Isolated external service did not become ready');
          }
          JS
      - run: npm test
        working-directory: backend
        env:
          MAILPIT_SMTP_PORT: "18125"
          MAILPIT_API_URL: http://127.0.0.1:18126
          S3MOCK_ENDPOINT: http://127.0.0.1:18127
      - name: Stop isolated SMTP and S3 protocol services
        if: always()
        working-directory: .
        run: docker compose -p shopmate-external-ci -f deploy/compose.external-acceptance.yaml down
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
        working-directory: backend
      - run: npm run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python formatter
        run: python -m pip install -r ../scripts/requirements-format.txt
      - name: Check repository formatting
        run: npm run format:check -- --tracked
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify production account and payment browser flows over isolated HTTPS
        run: npx playwright test --config playwright.production.config.ts
      - name: Build and start isolated Docker deployment
        working-directory: .
        env:
          ADMIN_PASSWORD: CIContainer123!
          APP_PORT: "18087"
          APP_ORIGINS: http://127.0.0.1:18087
          VCS_REF: ${{ github.sha }}
        run: docker compose -p shopmate-auth-ci -f compose.yaml -f deploy/compose.acceptance.yaml up -d --build --wait
      - name: Validate production edge and proxy configuration
        working-directory: .
        run: |
          docker run --rm --network none -e DOMAIN=shop.example.test -e ACME_EMAIL=ops@example.test --mount "type=bind,source=$GITHUB_WORKSPACE/deploy/Caddyfile,target=/etc/caddy/Caddyfile,readonly" caddy:2.11.9-alpine@sha256:71d41fe4b1ae92a058abc87afe614178b996d8a6b96d0f4c71ae30606e5927e3 caddy validate --config /etc/caddy/Caddyfile
          docker run --rm --network none -e CADDY_IP=10.254.86.2 --mount "type=bind,source=$GITHUB_WORKSPACE/deploy/nginx.production.conf.template,target=/etc/nginx/templates/default.conf.template,readonly" shopmate-ai-web:acceptance nginx -t
      - name: Scan complete API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shopmate-ai-api:acceptance
          scanners: vuln
          format: json
          output: api-vulnerabilities.json
          exit-code: "0"
      - name: Scan complete Web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shopmate-ai-web:acceptance
          scanners: vuln
          format: json
          output: web-vulnerabilities.json
          exit-code: "0"
          skip-setup-trivy: true
      - name: Scan production HTTPS edge image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: caddy:2.11.9-alpine@sha256:71d41fe4b1ae92a058abc87afe614178b996d8a6b96d0f4c71ae30606e5927e3
          scanners: vuln
          format: json
          output: edge-vulnerabilities.json
          exit-code: "0"
          skip-setup-trivy: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-vulnerability-reports
          path: "*-vulnerabilities.json"
          if-no-files-found: error
      - name: Reject high and critical image vulnerabilities
        working-directory: .
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          trivy image --scanners vuln --skip-db-update --severity HIGH,CRITICAL --exit-code 1 shopmate-ai-api:acceptance
          trivy image --scanners vuln --skip-db-update --severity HIGH,CRITICAL --exit-code 1 shopmate-ai-web:acceptance
      - name: Install the verified native edge VEX scanner
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.76.2
      - name: Assess edge HIGH gate with verified configuration and native OpenVEX
        working-directory: .
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          set -euo pipefail
          edge_vex_dir=$(mktemp -d "$RUNNER_TEMP/shopmate-edge-vex.XXXXXX")
          node scripts/production-edge-vex.mjs --output "$edge_vex_dir/edge.openvex.json"
          cp "$edge_vex_dir/edge.openvex.json" edge-config.openvex.json
          cp "$edge_vex_dir/edge.openvex.json.evidence.json" edge-config-evidence.json
          cp "$edge_vex_dir/edge.openvex.json.adapted.json" edge-config-adapted.json
          trivy image --scanners vuln --skip-db-update --severity HIGH,CRITICAL --exit-code 1 --vex "$edge_vex_dir/edge.openvex.json" --format json --output edge-assessed-vulnerabilities.json caddy:2.11.9-alpine@sha256:71d41fe4b1ae92a058abc87afe614178b996d8a6b96d0f4c71ae30606e5927e3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-configuration-vex-assessment
          path: |
            edge-config*.json
            edge-assessed-vulnerabilities.json
          if-no-files-found: ignore
      - name: Verify proxy security headers and compressed request rejection
        working-directory: .
        env:
          SECURITY_BASE_URL: http://127.0.0.1:18087
        run: node backend/scripts/verify-security-headers.mjs
      - name: Verify authentication and traditional commerce through containers
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:18087
          E2E_ADMIN_PASSWORD: CIContainer123!
          E2E_MUTATIONS_ALLOWED: "1"
        run: npm run test:e2e -- e2e/auth.spec.ts e2e/catalogue-smoke.spec.ts e2e/traditional-container.spec.ts e2e/joint-commerce.spec.ts --output=test-results-container
      - name: Container diagnostics
        if: failure()
        working-directory: .
        run: docker ps -a --filter label=com.docker.compose.project=shopmate-auth-ci
      - name: Start a separate operations acceptance deployment
        working-directory: .
        env:
          ADMIN_PASSWORD: CIContainer123!
          APP_PORT: "18091"
          APP_ORIGINS: http://127.0.0.1:18091
          VCS_REF: ${{ github.sha }}
          ACCEPTANCE_LEGACY_COMMANDS: "false"
        run: docker compose -p shopmate-operations-ci -f compose.yaml -f deploy/compose.acceptance.yaml up -d --wait
      - name: Verify extended commerce and staff forms through containers
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:18091
          E2E_ADMIN_PASSWORD: CIContainer123!
          E2E_MUTATIONS_ALLOWED: "1"
        run: npm run test:e2e -- e2e/extension-feature.spec.ts e2e/operations-ui.spec.ts e2e/staff-role-flows.spec.ts --output=test-results-operations
      - name: Start a fresh maintenance and role acceptance deployment
        working-directory: .
        env:
          ADMIN_PASSWORD: CIContainer123!
          APP_PORT: "18105"
          APP_ORIGINS: http://127.0.0.1:18105
          VCS_REF: ${{ github.sha }}
          ACCEPTANCE_LEGACY_COMMANDS: "false"
          AI_ENABLED: "false"
        run: |
          docker compose -p shopmate-maintenance-ci -f compose.yaml -f deploy/compose.acceptance.yaml up -d --wait
          docker compose -p shopmate-maintenance-ci -f compose.yaml -f deploy/compose.acceptance.yaml exec -T -e E2E_MUTATIONS_ALLOWED=1 api node --import tsx scripts/seed-role-maintenance.ts
      - name: Verify owner recovery and real staff handoffs
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:18105
          E2E_ADMIN_PASSWORD: CIContainer123!
          E2E_MUTATIONS_ALLOWED: "1"
          E2E_MAINTENANCE_FIXTURE: "1"
        run: npm run test:e2e -- e2e/maintenance-workbench.spec.ts e2e/final-role-experience.spec.ts --output=test-results-maintenance
      - name: Start isolated synthetic AI quality deployment
        working-directory: .
        env:
          ADMIN_PASSWORD: CIContainer123!
          APP_PORT: "18104"
          APP_ORIGINS: http://127.0.0.1:18104
          VCS_REF: ${{ github.sha }}
          ACCEPTANCE_LEGACY_COMMANDS: "false"
        run: docker compose -p shopmate-quality-ci -f compose.yaml -f deploy/compose.acceptance.yaml -f deploy/compose.quality.yaml up -d --wait
      - name: Verify 40 synthetic AI contracts through real HTTP and tools
        working-directory: .
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:18104
          E2E_ADMIN_PASSWORD: CIContainer123!
          AI_ACCEPTANCE_ALLOWED: "1"
          AI_ACCEPTANCE_CONTAINER: shopmate-quality-ci-api-1
          AI_QUALITY_MODE: matrix
          AI_ACCEPTANCE_REPORT: .delivery/ai-quality-matrix-ci.json
        run: node backend/scripts/ai-quality.mjs
      - name: Verify independent AI task questions
        working-directory: .
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:18104
          E2E_ADMIN_PASSWORD: CIContainer123!
          AI_ACCEPTANCE_ALLOWED: "1"
          AI_ACCEPTANCE_CONTAINER: shopmate-quality-ci-api-1
          AI_QUALITY_MODE: matrix
          AI_QUALITY_SUITE: holdout
          AI_ACCEPTANCE_REPORT: .delivery/ai-quality-holdout-ci.json
        run: node backend/scripts/ai-quality.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-quality-contract-report
          path: .delivery/ai-quality-*-ci*.json
          if-no-files-found: ignore
      - name: Verify task answers and reload with synthetic providers
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:18104
          E2E_AI_TASK_FIXTURE: "1"
        run: npm run test:e2e -- e2e/ai-task-experience.spec.ts --output=test-results-ai-task
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            frontend/test-results
            frontend/test-results-container
            frontend/test-results-operations
            frontend/test-results-maintenance
            frontend/test-results-ai-task
            frontend/test-results-production
      - name: Export validated container images
        working-directory: .
        run: docker image save shopmate-ai-api:acceptance shopmate-ai-web:acceptance | gzip > validated-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: validated-container-images
          path: validated-images.tar.gz
          retention-days: 1
  sources:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: validated-container-images
          path: .delivery/container-release
      - name: Load the validated images
        run: gzip -dc .delivery/container-release/validated-images.tar.gz | docker load
      - name: Collect corresponding container sources and notices
        run: |
          python3 scripts/collect-container-sources.py --api shopmate-ai-api:acceptance --web shopmate-ai-web:acceptance --output .delivery/container-sources
          tar --exclude='container-sources/alpine/*/src' -C .delivery -czf container-sources.tar.gz container-sources
          sha256sum container-sources.tar.gz > container-sources.SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: validated-container-sources
          path: |
            container-sources.tar.gz
            container-sources.SHA256SUMS
          retention-days: 1
