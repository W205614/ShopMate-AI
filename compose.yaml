name: shopmate-ai
services:
  api:
    image: shopmate-ai-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VCS_REF: ${VCS_REF:-local}
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env before first startup}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:18086,http://127.0.0.1:18086}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: "true"
      BACKUP_DIR: /app/backups
      LOG_REQUESTS: ${LOG_REQUESTS:-true}
      AFTER_SALE_DAYS: ${AFTER_SALE_DAYS:-7}
      ALLOW_LEGACY_COMMANDS: ${ALLOW_LEGACY_COMMANDS:-false}
      AI_ENABLED: ${AI_ENABLED:-false}
      LLM_MODEL_ID: ${LLM_MODEL_ID:-deepseek-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      AI_PROVIDER_TIMEOUT_MS: ${AI_PROVIDER_TIMEOUT_MS:-30000}
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-2}
      AI_MAX_QUEUE: ${AI_MAX_QUEUE:-20}
      AI_USER_DAILY_CONSULTATIONS: ${AI_USER_DAILY_CONSULTATIONS:-20}
      AI_DAILY_PROVIDER_CALLS: ${AI_DAILY_PROVIDER_CALLS:-100}
      SUPPORT_DAILY_CONVERSATIONS: ${SUPPORT_DAILY_CONVERSATIONS:-20}
      SUPPORT_MAX_USER_TURNS: ${SUPPORT_MAX_USER_TURNS:-100}
      AI_KNOWLEDGE_MAX_CHUNKS: ${AI_KNOWLEDGE_MAX_CHUNKS:-5000}
      AI_KNOWLEDGE_MAX_VECTOR_BYTES: ${AI_KNOWLEDGE_MAX_VECTOR_BYTES:-67108864}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-3072}
      SEND_EMBEDDING_DIMENSIONS: ${SEND_EMBEDDING_DIMENSIONS:-false}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-true}
      RERANKER_MODEL: ${RERANKER_MODEL:-Pro/BAAI/bge-reranker-v2-m3}
      RERANKER_URL: ${RERANKER_URL:-https://api.siliconflow.cn/v1/rerank}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_TIMEOUT_SECONDS: ${RERANKER_TIMEOUT_SECONDS:-2}
    volumes:
      - api_data:/app/data
      - ${BACKUP_PATH:-./backups}:/app/backups
    stop_grace_period: 20s
    mem_limit: 1g
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
  web:
    image: shopmate-ai-web:local
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:-local}
    ports:
      - "127.0.0.1:${APP_PORT:-18086}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  api_data:
