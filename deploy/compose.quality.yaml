# Synthetic protocol acceptance only. Use with compose.yaml + compose.acceptance.yaml,
# an independent project, port and data volume. No upstream credentials are required.
services:
  api:
    environment:
      AI_ENABLED: "true"
      # This isolated protocol matrix intentionally exceeds daily demo limits.
      AI_USER_DAILY_CONSULTATIONS: "200"
      AI_DAILY_PROVIDER_CALLS: "2000"
      SUPPORT_DAILY_CONVERSATIONS: "200"
      LLM_BASE_URL: http://provider:18103
      LLM_API_KEY: synthetic-quality-provider
      EMBEDDING_BASE_URL: http://provider:18103
      EMBEDDING_API_KEY: synthetic-quality-provider
      EMBEDDING_DIMENSION: "3"
      EMBEDDING_DIMENSIONS: "3"
      SEND_EMBEDDING_DIMENSIONS: "true"
      RERANKER_URL: http://provider:18103/rerank
      RERANKER_API_KEY: synthetic-quality-provider
      RERANKER_ENABLED: "true"
    depends_on:
      provider:
        condition: service_healthy
  provider:
    image: shopmate-ai-api:${ACCEPTANCE_TAG:-acceptance}
    command: ["node", "scripts/ai-quality-provider.mjs"]
    environment:
      AI_ACCEPTANCE_ALLOWED: "1"
      AI_QUALITY_PROVIDER_HOST: 0.0.0.0
      AI_QUALITY_PROVIDER_PORT: "18103"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18103/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
