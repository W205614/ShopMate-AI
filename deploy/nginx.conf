server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        client_max_body_size 8m;
    }
    location = /index.html { add_header Cache-Control "no-store"; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location /images/ { try_files $uri =404; expires 1d; }
    location / { try_files $uri $uri/ /index.html; }
}
