resolver 127.0.0.11 valid=5s ipv6=off;
log_format shopmate escape=json '{"time":"$time_iso8601","requestId":"$request_id","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';
upstream shopmate_api {
    zone shopmate_api 64k;
    server api:3001 resolve;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 4s;
}
server {
    access_log /var/log/nginx/access.log shopmate;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/ {
        proxy_pass http://shopmate_api;
        proxy_http_version 1.1;
        # The proxy owns this header; avoid duplicate values from Express.
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        client_max_body_size 15m;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
    location /images/ { try_files $uri =404; expires 1d; }
    location / { try_files $uri $uri/ /index.html; }
}
