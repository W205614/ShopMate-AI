global:
  resolve_timeout: 5m
route:
  receiver: unconfigured
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
# Configure a real receiver in a private file and set ALERTMANAGER_CONFIG_PATH.
# This explicit empty receiver does not imply external alert delivery is configured.
receivers:
  - name: unconfigured
